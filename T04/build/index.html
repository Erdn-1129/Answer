<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erdn-T04</title>

  <link rel="stylesheet" href="../src/style.css">
</head>

<body>

  <svg
    id="chart"
    role="img"
    aria-label="五个岗位指标的五边形分区地平线图"
    viewBox="0 40 900 680"
    preserveAspectRatio="xMidYMid meet"
    style="width:100%;height:auto;display:block">
  </svg>

  <!-- 优先加载本地 D3（断网也能演示），本地缺失时回退 CDN -->
  <script src="../src/vendor/d3.v7.min.js"></script>
  <script>
    window.d3 || document.write(
      '<script src="https://cdn.jsdelivr.net/npm/d3@7"><\/script>'
    );
  </script>

  <!-- 兜底诊断：D3 没加载成功时给出原因，
       否则页面只会一片空白，无从排查 -->
  <script>
    if (!window.d3) {
      document.body.insertAdjacentHTML(
        "afterbegin",
        '<p style="color:#ff6b6b;text-align:center;' +
        'font:14px system-ui;padding:20px">' +
        'D3 加载失败：请确认 src/vendor/d3.v7.min.js 存在，' +
        '或用「单文件版.html」打开</p>'
      );
    }
  </script>

  <script src="../src/chart.js"></script>

</body>
</html>
